[package]
name = "rapid-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = { version = "2.9.1", default-features = false, features = ["serde"] }
chrono = "0.4.45"
eframe = "0.36.1"
egui = "0.36.1"
egui_plot = "0.37.0"
egui_tiles = "0.17.0"
env_logger = "0.11.11"
image = "0.25.10"
log = "0.4.33"
mavlink-core = { version = "0.18.0", default-features = false, features = ["std", "serde"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
rfd = "0.17.2"
rodio = "0.22.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrays = "0.2.0"
serde_json = "1.0.151"

[build-dependencies]
mavlink-bindgen = "0.18.0"
# Second pass over the dialect XML for the schema mavlink-bindgen drops
# (units, instance fields, enums); same version the generator itself uses.
quick-xml = "0.39"

[features]
default = ["dialect-rapid", "serde"]
# Gates the generated `rapid` dialect module (see build.rs); mavlink-bindgen
# emits one such feature-gated module per XML file in mavlink_dialects/.
dialect-rapid = []
# Enables Serialize/Deserialize on the generated message types; matches the
# `#[cfg(feature = "serde")]` mavlink-bindgen bakes into its output.
serde = []

[lints.rust]
# mavlink-bindgen's generated code (build.rs) checks feature flags -- e.g.
# "arbitrary", "ts-rs" -- for optional integrations we don't use; harmless.
unexpected_cfgs = "allow"
