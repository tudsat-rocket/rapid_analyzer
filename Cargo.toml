[package]
name = "rapid-analyzer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bitflags = { version = "2.9.1", default-features = false, features = ["serde"] }
chrono = "0.4.45"
eframe = "0.36.1"
egui = "0.36.1"
egui_plot = "0.37.0"
egui_tiles = "0.17.0"
image = "0.25.10"
log = "0.4.33"
mavlink-core = { version = "0.18.0", default-features = false, features = ["std", "serde"] }
num-derive = "0.4"
num-traits = { version = "0.2", default-features = false }
rfd = "0.17.2"
# Behind the `media` feature, as is everything that shells out to ffmpeg.
rodio = { version = "0.22.2", optional = true }
# Behind the `sqlite` feature: `bundled` compiles SQLite from C, which has no
# wasm32-unknown-unknown build.
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_arrays = "0.2.0"
serde_json = "1.0.151"
# `std::time::Instant` on the desktop; the browser's clock on the web, where
# the std one panics.
web-time = "1.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.104"
wasm-bindgen = "0.2.127"
wasm-bindgen-futures = "0.4.77"
web-sys = { version = "0.3.104", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "HtmlElement", "Url", "Window"] }

[build-dependencies]
mavlink-bindgen = "0.18.0"
# Second pass over the dialect XML for the schema mavlink-bindgen drops
# (units, instance fields, enums); same version the generator itself uses.
quick-xml = "0.39"

[features]
# The web build (`trunk build`, see index.html) turns off `media` and `sqlite`
# by building with no default features and naming the first two.
default = ["dialect-rapid", "serde", "media", "sqlite"]
# Gates the generated `rapid` dialect module (see build.rs); mavlink-bindgen
# emits one such feature-gated module per XML file in mavlink_dialects/.
dialect-rapid = []
# Enables Serialize/Deserialize on the generated message types; matches the
# `#[cfg(feature = "serde")]` mavlink-bindgen bakes into its output.
serde = []
# Video and audio sources: `ffprobe`/`ffmpeg` subprocesses for metadata,
# frames and waveforms, and `rodio` for playback. Desktop only -- a browser
# can start neither a process nor a thread.
media = ["dep:rodio"]
# The SQLite sensor log importer (`import/sqlite_log.rs`).
sqlite = ["dep:rusqlite"]

[lints.rust]
# mavlink-bindgen's generated code (build.rs) checks feature flags -- e.g.
# "arbitrary", "ts-rs" -- for optional integrations we don't use; harmless.
unexpected_cfgs = "allow"
